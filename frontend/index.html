
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            Order Service
        </span>
        <span class="text-light small">
            Gestión de pedidos
        </span>
    </div>
</nav>

<main class="container py-4">

    <!-- Alertas -->
    <div id="alertContainer"></div>

    <div class="row g-4">

        <!-- Crear pedido -->
        <div class="col-lg-7">

            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">Crear pedido</h5>
                </div>

                <div class="card-body">

                    <form id="createOrderForm">

                        <div class="mb-3">
                            <label for="customerId" class="form-label">
                                ID del cliente
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="customerId"
                                value="11111111-1111-1111-1111-111111111111"
                                required
                            >
                        </div>

                        <div class="border rounded p-3 mb-3">

                            <h6>Producto</h6>

                            <div class="mb-3">
                                <label for="productId" class="form-label">
                                    ID del producto
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="productId"
                                    value="22222222-2222-2222-2222-222222222222"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="productName" class="form-label">
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="productName"
                                    value="Producto de prueba"
                                    required
                                >
                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label for="unitPrice" class="form-label">
                                        Precio unitario
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="unitPrice"
                                        value="35000"
                                        min="0.01"
                                        step="0.01"
                                        required
                                    >
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="quantity" class="form-label">
                                        Cantidad
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="quantity"
                                        value="1"
                                        min="1"
                                        required
                                    >
                                </div>

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                            id="createButton"
                        >
                            Crear pedido
                        </button>

                    </form>

                </div>
            </div>

        </div>


        <!-- Consultar / administrar -->
        <div class="col-lg-5">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h5 class="mb-0">Administrar pedido</h5>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label for="orderId" class="form-label">
                            ID del pedido
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="orderId"
                            placeholder="UUID del pedido"
                        >
                    </div>

                    <div class="d-grid gap-2">

                        <button
                            class="btn btn-outline-primary"
                            id="getOrderButton"
                        >
                            Consultar pedido
                        </button>

                        <button
                            class="btn btn-success"
                            id="confirmOrderButton"
                        >
                            Confirmar pedido
                        </button>

                        <button
                            class="btn btn-danger"
                            id="cancelOrderButton"
                        >
                            Cancelar pedido
                        </button>

                    </div>

                </div>

            </div>


            <!-- Resultado -->
            <div class="card shadow-sm mt-4">

                <div class="card-header">
                    <h5 class="mb-0">Resultado</h5>
                </div>

                <div class="card-body">

                    <div id="orderResult" class="d-none">

                        <dl class="row mb-0">

                            <dt class="col-sm-5">ID</dt>
                            <dd class="col-sm-7" id="resultId"></dd>

                            <dt class="col-sm-5">Cliente</dt>
                            <dd class="col-sm-7" id="resultCustomer"></dd>

                            <dt class="col-sm-5">Total</dt>
                            <dd class="col-sm-7" id="resultTotal"></dd>

                            <dt class="col-sm-5">Estado</dt>
                            <dd class="col-sm-7">
                                <span id="resultStatus" class="badge"></span>
                            </dd>

                        </dl>

                    </div>

                    <div id="emptyResult" class="text-muted text-center">
                        No hay información para mostrar.
                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="js/app.js"></script>

</body>
</html>
